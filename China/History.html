<section class="people">
    <h1><span> Ancient China </span></h1>
    <section class="people-reel">
        <figure class="person">
            <img src="../IMAGES/Early Civilization.jpg" alt="Early Civlization"> 
            <figcaption class="person-caption">Early settlements along the Yellow River developed farming, pottery, and communal villages. These foundations shaped the earliest forms of Chinese culture, technology, and social organization. </figcaption>
        </figure> 
        <figure class="person">
            <img src="../IMAGES/Xia Dynasty.jpg" alt="Xia Dynasty"> 
            <figcaption class="person-caption">Tradition places the Xia as China’s first dynasty, followed by the Shang with its advanced bronze work and the Zhou, who introduced the Mandate of Heaven as a guiding political principle.</figcaption>
        </figure> 
        <figure class="person">
            <img src="../IMAGES/Chinese Bronze Age.jpg" alt="Bronze Age"> 
            <figcaption class="person-caption">China’s Bronze Age produced sophisticated ritual vessels, weapons, and tools. These artworks reveal a society with skilled craftsmanship and complex ceremonial traditions.</figcaption>
        </figure> 
        <figure class="person">
            <img src="../IMAGES/Chinese Writing.jpg" alt="Early Writing"> 
            <figcaption class="person-caption">The earliest Chinese writing emerged as pictographs carved into turtle shells, bones, and bronze. Over time, these symbols evolved into the characters still used today.</figcaption>
        </figure> 
        <figure class="person">
            <img src="../IMAGES/Oracle Bones.jpg" alt="Oracle Bones"> 
            <figcaption class="person-caption">Oracle bones were used in Shang Dynasty divination rituals. Questions about weather, warfare, and royal affairs were inscribed and heated, and the resulting cracks were interpreted as messages from ancestors.</figcaption>
        </figure> 
    </section>
</section>
<section class="people">
    <h1><span> Classical Period </span></h1>
    <section class="people-reel">
        <figure class="person">
            <img src="../IMAGES/Confucianism.jpg" alt="Confucius"> 
            <figcaption class="person-caption">Confucius taught the importance of virtue, order, and respectful relationships. His ideas became the foundation of Chinese governance, education, and moral philosophy for thousands of years. </figcaption>
        </figure> 
        <figure class="person">
            <img src="../IMAGES/Thinking Confucius.png" alt="Thinking Confucius"> 
            <figcaption class="person-caption">During the Spring and Autumn and Warring States eras, thinkers debated how to achieve order and prosperity. Competing schools like the Confucian, Daoist, Legalist, and many other, shaped China’s intellectual legacy.</figcaption>
        </figure> 
        <figure class="person">
            <img src="../IMAGES/Terracotta Army.jpg" alt="Terracotta Army"> 
            <figcaption class="person-caption">The Qin unified China for the first time, standardizing laws, writing, currency, and measurements. Though short-lived, their reforms laid the groundwork for future dynasties.</figcaption>
        </figure> 
        <figure class="person">
            <img src="../IMAGES/Great Wall of China.jpg" alt="The Great Wall"> 
            <figcaption class="person-caption">Early sections of the Great Wall were built by the Qin to protect against northern nomadic groups. Later dynasties expanded and reinforced these defensive barriers.</figcaption>
        </figure> 
        <figure class="person">
            <img src="../IMAGES/Han Dynasty.jpg" alt="Han Dynasty Official"> 
            <figcaption class="person-caption">Under the Han, China experienced economic growth, imperial expansion, and major innovations such as paper-making. This era became a model for future dynasties.</figcaption>
        </figure> 
    </section>
</section>
<section class="people">
    <h1><span> Three Kingdoms </span></h1>
    <section class="people-reel">
        <figure class="person">
            <img src="../IMAGES/Battle of Red Cliffs.jpg" alt="Battle of Red Cliffs"> 
            <figcaption class="person-caption">After the fall of the Han, China fractured into the rival states of Wei, Shu, and Wu. This dramatic era is remembered for its legendary generals, battles, and political intrigue. </figcaption>
        </figure> 
        <figure class="person">
            <img src="../IMAGES/Grand Canal.jpg" alt="Grand Canal"> 
            <figcaption class="person-caption">The Sui reunified China after centuries of division and began the Grand Canal, a massive engineering project linking northern and southern China.</figcaption>
        </figure> 
        <figure class="person">
            <img src="../IMAGES/Tang Dynasty.jpg" alt="Tang Dynasty Mural"> 
            <figcaption class="person-caption">The Tang Dynasty ushered in a vibrant age of trade, art, and poetry. Chang’an became one of the world’s most multicultural and prosperous cities.</figcaption>
        </figure> 
        <figure class="person">
            <img src="../IMAGES/Song Dynasty Clock.jpg" alt="Song Dynasty Clock"> 
            <figcaption class="person-caption">The Song era saw major advances in printing, navigation, mathematics, and agriculture. Its thriving urban culture helped shape China’s early modern identity.</figcaption>
        </figure> 
        <figure class="person">
            <img src="../IMAGES/Chinese Poetry.jpg" alt="Chinese Poetry"> 
            <figcaption class="person-caption">From Tang poets like Li Bai to Song painters and scholars, this long period produced some of China’s most beloved artistic masterpieces.</figcaption>
        </figure> 
    </section>
</section>
<section class="people">
    <h1><span> Conquest Dynasties </span></h1>
    <section class="people-reel">
        <figure class="person">
            <img src="../IMAGES/mongol.jpg" alt="Mongol Depiction"> 
            <figcaption class="person-caption">The Mongols united China under the Yuan Dynasty, encouraging trade across Eurasia. Their rule brought new cultural exchanges and technologies. </figcaption>
        </figure> 
        <figure class="person">
            <img src="../IMAGES/Zheng He.jpg" alt="Zheng He"> 
            <figcaption class="person-caption">During the Ming Dynasty, Admiral Zheng He led vast fleets across the Indian Ocean, projecting Chinese influence from Southeast Asia to East Africa.</figcaption>
        </figure> 
        <figure class="person">
            <img src="../IMAGES/Ming Great Wall.jpg" alt="The Great Wall from on Top"> 
            <figcaption class="person-caption">The Ming strengthened the Great Wall into the form seen today and built Beijing as an imperial capital centered on the grand Forbidden City.</figcaption>
        </figure> 
        <figure class="person">
            <img src="../IMAGES/Manchu People.jpg" alt="Manchu Conquest"> 
            <figcaption class="person-caption">The Manchu established the Qing Dynasty, expanding China’s borders and blending their traditions with established Chinese governance.</figcaption>
        </figure> 
        <figure class="person">
            <img src="../IMAGES/Imperial Portrait.jpg" alt="Imperial Portrait"> 
            <figcaption class="person-caption">At its height, the Qing presided over a culturally rich and diverse empire. Scholarship, art, and everyday life thrived under a stable social system.</figcaption>
        </figure> 
    </section>
</section>
<section class="people">
    <h1><span> Modern China </span></h1>
    <section class="people-reel">
        <figure class="person">
            <img src="../IMAGES/Opium War Depiction.jpg" alt="Opium Wars & Treaty Ports"> 
            <figcaption class="person-caption">Foreign pressure and the Opium Wars forced China to open treaty ports, marking the beginning of a turbulent era of internal and external crises. </figcaption>
        </figure> 
        <figure class="person">
            <img src="../IMAGES/Xinhai Revolutionaires.jpg" alt="Xinhai Revolutionaires"> 
            <figcaption class="person-caption">Widespread unrest and reform movements led to the end of imperial rule. The 1911 Revolution established the Republic of China.</figcaption>
        </figure> 
        <figure class="person">
            <img src="../IMAGES/Warlord Era Map.png" alt="Warlord Era Map"> 
            <figcaption class="person-caption">The early republic struggled with warlord divisions, foreign influence, and competing political movements, shaping China’s modern transformation.</figcaption>
        </figure> 
        <figure class="person">
            <img src="../IMAGES/Chinese Flag.jpg" alt="Chinese Flag"> 
            <figcaption class="person-caption">Founded in 1949, the PRC embarked on sweeping social and economic changes. Its development continues to define contemporary Chinese society.</figcaption>
        </figure> 
        <figure class="person">
            <img src="../IMAGES/Great Wall from Afar.jpg" alt="Great Wall from Afar">
            <figcaption class="person-caption">Economic reforms beginning in the late 20th century brought rapid modernization. Today, China is a major global cultural and economic presence.</figcaption>
        </figure> 
    </section>
