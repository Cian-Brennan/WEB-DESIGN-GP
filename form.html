<!-- Sign Up Form Section -->
  <div class="signup-section">
    <div class="form-title">
      <h2>Sign Up</h2>
      <p>Fill in the form to join us.</p>
    </div>

    <div class="form-box">
      <form id="pollForm" onsubmit="submitPoll(event)">
        <!-- Name -->
        <div class="form-group">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required placeholder="Enter your name">
        </div>

        <!-- Age -->
        <div class="form-group">
          <label for="age">Age:</label>
          <input type="number" id="age" name="age" required placeholder="Enter your age">
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required placeholder="Enter your email">
        </div>

        <!-- Subscribe Option -->
        <div class="form-group">
          <label>Subscribe to Newsletter?</label>
          <input type="radio" id="subscribeYes" name="subscribe" value="true" checked>
          <label for="subscribeYes">Yes</label>
          <input type="radio" id="subscribeNo" name="subscribe" value="false">
          <label for="subscribeNo">No</label>
        </div>

        <!-- Submit Button -->
        <div class="form-group">
          <button type="submit" class="cta-btn">Submit</button>
        </div>
      </form>
    </div>
  </div>

  </body>
</html>
