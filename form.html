<header>
    <div class="universal">
        <nav class="page-nav">
            <ul>
                <li><a href="./"><img src="./IMAGES/Home.png" alt="Home Button" style="width: 50px;"></a></li>
                <li><a href="./Albania"><img src="./IMAGES/Albanian Flag.svg" alt="Albanian Flag"></a></li>

</header>
<div class="form_container">
        <div class="form-title">
        <h2>Contact Us</h2>
        <p>Fill in the form to contact us.</p>
        </div>

        <div class="form-box">
        <form id="pollForm">
            <!-- Name -->
            <div class="form-group">
            <label>Name:</label>
            <input type="text" id="name" required placeholder="Enter your name">
            </div>

            <!-- Number -->
            <div class="form-group">
            <label>Number:</label>
            <input type="digits" id="age" required placeholder="Enter your age">
            </div>

            <!-- Email -->
            <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" required placeholder="Enter your email">
            </div>

            <!-- Submit Button -->
            <div class="form-group">
                <button type="submit" class="cta-btn">Submit</button>
            </div>
        </form>
    </div>
</div>
 <footer>
    <p>Footer</p>
  </footer>
  </body>
</html>
